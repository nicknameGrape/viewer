<!DOCTYPE html>
<meta charset="UTF-8">
<head>
	<link rel="stylesheet" href="viewer_styles.css"/>
</head>
<body>
	<div id="controls">
		<div id="tiles_or_slides">
			<em style="grid-area: title">View</em>
			<input type="radio" name="view" id="button_tiles" checked></input>
			<label for="button_tiles">Tiles</label>
			<input type="radio" name="view" id="button_slides"></input>
			<label for="button_slides">Slides</label>
		</div>
		<hr/>
		<div id="first_next_prev_random">
			<em>Slide</em>
			<pre style="margin: -5px 0px 10px 0px;"><span id="currentSlide">1</span> / <span id="numberOfSlides">?</span></pre>
			<button id="first">First</button>
			<button id="next">Next<br>&rarr;</button>
			<button id="prev">Prev<br>&larr;</button>
			<button id="rand">Random</button>
		</div>
		<div id="rows">
			<em>Rows</em>
			<input type="radio" name="rows" id="rows2" value="2"></input>
			<label for="rows2">2</label>
			<input type="radio" name="rows" id="rows3" value="3"></input>
			<label for="rows3">3</label>
			<input type="radio" name="rows" id="rows4" value="4" checked></input>
			<label for="rows4">4</label>
			<input type="radio" name="rows" id="rows5" value="5"></input>
			<label for="rows5">5</label>
			<input type="radio" name="rows" id="rows6" value="6"></input>
			<label for="rows6">6</label>
		</div>
		<hr/>
	</div>
	<div id="slides">
		<img id="slide"/>
	</div>
	<div id="tiles">
	</div>
	<script type="module" src="pdf.mjs"></script>
	<script src="sets.js"></script>
	<script type="module">
//pdfjs stuff
var { pdfjsLib } = globalThis;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.mjs';

function dropHandler(ev) {
	ev.preventDefault();
	Array.from(ev.dataTransfer.items).forEach(function (item) {
		let file = item.getAsFile();
		let reader = new FileReader();
		let type = item.type;
		reader.addEventListener("load", function () {
			if (type.startsWith("image")) {
				let img = document.createElement("img");
				img.src = this.result;
				slides.push(img);
				document.getElementById("tiles").appendChild(img);
				console.log(slides);
			} else if (type === ("application/pdf")) {
				var loadingTask = pdfjsLib.getDocument(this.result);
				loadingTask.promise.then(function(pdf) {
						console.log('PDF loaded');

						// Fetch all pages
						console.log(pdf.numPages, "pages");
						for (let i=1; i<=pdf.numPages; i++) {
						pdf.getPage(i).then(function(page) {
								var viewport = page.getViewport({"scale": 1.5});
								console.log('Page loaded');
								let canvas = document.createElement("canvas");
								let context = canvas.getContext("2d");
								canvas.width = viewport.width;
								canvas.height = viewport.height;
								var renderTask = page.render({"canvasContext": context, "viewport": viewport});
								renderTask.promise.then(function () {
										console.log('Page rendered');
										slides.push(canvas);
										document.getElementById("tiles").appendChild(canvas);
										});

								});
						}
				});
			}
		});
		reader.readAsDataURL(file);
	});
}
function setTileHeight(ev) {
	let newHeight = 100 / ev.target.value;
	document.querySelectorAll("#tiles img, #tiles canvas").forEach(el => el.style.height = "calc(" + newHeight + "vh - 10px)");
}
let slides = [];
let currentIndex = 0;
window.addEventListener("dragover", function (ev) {console.log("DRGOVR");});
window.addEventListener("dragover", ev => ev.preventDefault());
window.addEventListener("drop", dropHandler);
document.getElementById("button_tiles").addEventListener("change", function () {
	document.getElementById("rows").style.display="flex";
	document.getElementById("first_next_prev_random").style.display="none";
	document.getElementById("tiles").style.display="flex";
	document.getElementById("slides").style.display="none";
});
document.getElementById("button_slides").addEventListener("change", function () {
	document.getElementById("rows").style.display="none";
	document.getElementById("first_next_prev_random").style.display="flex";
	document.getElementById("tiles").style.display="none";
	document.getElementById("slides").style.display="flex";
	if (slides[currentIndex].tagName === "IMG") {
		document.getElementById("slide").src = slides[currentIndex].src;
	} else if (slides[currentIndex].tagName === "CANVAS") {
		document.getElementById("slide").src = slides[currentIndex].toDataURL();
	}
	document.getElementById("currentSlide").innerHTML = currentIndex+1;
	document.getElementById("numberOfSlides").innerHTML = slides.length;
});
document.getElementById("first").addEventListener("click", function () {
	currentIndex = 0;
	if (slides[currentIndex].tagName === "IMG") {
		document.getElementById("slide").src = slides[currentIndex].src;
	} else if (slides[currentIndex].tagName === "CANVAS") {
		document.getElementById("slide").src = slides[currentIndex].toDataURL();
	}
	document.getElementById("currentSlide").innerHTML = currentIndex+1;
	document.getElementById("numberOfSlides").innerHTML = slides.length;
});
document.getElementById("next").addEventListener("click", function () {
	currentIndex = (currentIndex+1)%slides.length;
	if (slides[currentIndex].tagName === "IMG") {
		document.getElementById("slide").src = slides[currentIndex].src;
	} else if (slides[currentIndex].tagName === "CANVAS") {
		document.getElementById("slide").src = slides[currentIndex].toDataURL();
	}
	document.getElementById("currentSlide").innerHTML = currentIndex+1;
	document.getElementById("numberOfSlides").innerHTML = slides.length;
});
document.getElementById("prev").addEventListener("click", function () {
	currentIndex = (currentIndex-1+slides.length)%slides.length;
	if (slides[currentIndex].tagName === "IMG") {
		document.getElementById("slide").src = slides[currentIndex].src;
	} else if (slides[currentIndex].tagName === "CANVAS") {
		document.getElementById("slide").src = slides[currentIndex].toDataURL();
	}
	document.getElementById("currentSlide").innerHTML = currentIndex+1;
	document.getElementById("numberOfSlides").innerHTML = slides.length;
});
document.getElementById("rand").addEventListener("click", function () {
	currentIndex = Math.floor(Math.random()*slides.length);
	if (slides[currentIndex].tagName === "IMG") {
		document.getElementById("slide").src = slides[currentIndex].src;
	} else if (slides[currentIndex].tagName === "CANVAS") {
		document.getElementById("slide").src = slides[currentIndex].toDataURL();
	}
	document.getElementById("currentSlide").innerHTML = currentIndex+1;
	document.getElementById("numberOfSlides").innerHTML = slides.length;
});
let radioButtonsThatControlRowHeight = Array.from(document.querySelectorAll('input[name="rows"]')).forEach(el => el.addEventListener("input", setTileHeight));
document.addEventListener("keydown", function (ev) {
	if (ev.key === "s") {document.getElementById("button_slides").click();}
	if (ev.key === "t") {document.getElementById("button_tiles").click();}
	if (ev.key === "1") {document.getElementById("first").click();}
	if (ev.key === "f") {document.getElementById("first").click();}
	if (ev.key === "ArrowRight") {document.getElementById("next").click();}
	if (ev.key === "n") {document.getElementById("next").click();}
	if (ev.key === " ") {document.getElementById("next").click();}
	if (ev.key === "ArrowLeft") {document.getElementById("prev").click();}
	if (ev.key === "p") {document.getElementById("prev").click();}
	if (ev.key === "r") {document.getElementById("rand").click();}
	if (ev.key === "2") {document.getElementById("rows2").click();}
	if (ev.key === "3") {document.getElementById("rows3").click();}
	if (ev.key === "4") {document.getElementById("rows4").click();}
	if (ev.key === "5") {document.getElementById("rows5").click();}
	if (ev.key === "6") {document.getElementById("rows6").click();}
})
let set = new URLSearchParams(document.location.search).get("set");
let pdf = new URLSearchParams(document.location.search).get("pdf");
let firstView = new URLSearchParams(document.location.search).get("view");
if (set !== null) {
	console.log(set);
	SETS[set].forEach(function (src) {
		let img = document.createElement("img");
		img.src = src;
		slides.push(img);
		tiles.appendChild(img)
		if (firstView !== null) {
			document.getElementById("button_"+firstView).click();
		} else {
			if (SETS[set].length === 1) {
				document.getElementById("button_slides").click();
			}
		}
	});
} else {
	console.log("no set specified");
}

if (pdf !== null) {
	console.log(pdf);
	var loadingTask = pdfjsLib.getDocument("pdfs/"+pdf);
	loadingTask.promise.then(function(pdf) {
			console.log('PDF loaded');

			// Fetch all pages
			console.log(pdf.numPages, "pages");
			for (let i=1; i<=pdf.numPages; i++) {
			pdf.getPage(i).then(function(page) {
					var viewport = page.getViewport({"scale": 1.5});
					console.log('Page loaded');
					let canvas = document.createElement("canvas");
					let context = canvas.getContext("2d");
					canvas.width = viewport.width;
					canvas.height = viewport.height;
					var renderTask = page.render({"canvasContext": context, "viewport": viewport});
					renderTask.promise.then(function () {
							console.log('Page rendered');
							slides.push(canvas);
							document.getElementById("tiles").appendChild(canvas);
							});

					});
			}
	});
	if (firstView !== null) {
		document.getElementById("button_"+firstView).click();
	}
} else {
	console.log("no set specified");
}
	</script>
</body>
</html>
